# Inputs for requirements-gguf.txt: llama.cpp b11980 convert requirements, CPU torch only from the PyTorch index.
[project]
name = "tunekeep-gguf-step"
version = "0"
requires-python = ">=3.12"
dependencies = [
  "torch==2.11.0",
  "numpy~=2.2.6",
  "sentencepiece>=0.1.98,<0.3.0",
  "transformers==4.57.6",
  "protobuf>=4.21.0,<5.0.0",
  "tqdm>=4.27",
  "pyyaml>=5.1",
  "requests>=2.25",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
